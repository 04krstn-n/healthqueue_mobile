name: healthqueue_mobapp
description: HealthQueue+ Patient Mobile App
publish_to: none
version: 2.0.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  provider: ^6.1.2
  http: ^1.2.0
  shared_preferences: ^2.2.2
  flutter_secure_storage: ^9.0.0
  intl: ^0.19.0
  google_fonts: ^6.2.1
  url_launcher: ^6.2.6
  cupertino_icons: ^1.0.6
  geolocator: ^11.0.0
  google_maps_flutter: ^2.10.0
  permission_handler: ^11.3.1
  font_awesome_flutter: ^11.0.0
  socket_io_client: ^3.1.6
  flutter_dotenv: ^6.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - .env
    - assets/icon/healthqueue_logo.png

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/icon/healthqueue_logo.png"
  min_sdk_android: 21
  adaptive_icon_background: "#0D9488"